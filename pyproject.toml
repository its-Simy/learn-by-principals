[project]
name = "brightlearn"
version = "0.1.0"
description = "Personal learning platform: course files -> NotebookLM -> learner memory."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# The minimum product runs on NotebookLM alone, so its client is a plain dependency. Claude Code
# and Codex are CLIs the user installs (see README "Optional models"), not Python packages.
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
    "notebooklm-py[android,browser]>=0.8.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.uv]
required-version = ">=0.8"

[project.scripts]
brightlearn = "cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "cli", "dashboard", "api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# Committed migrations are frozen SQL: reflowing a line would change the migration.
"core/memory/migrations/v*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
