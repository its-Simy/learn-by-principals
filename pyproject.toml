[project]
name = "brightlearn"
version = "0.1.0"
description = "Personal learning platform: Brightspace -> local files -> NotebookLM -> learner memory."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "playwright>=1.45",
    "pyyaml>=6",
]

[project.optional-dependencies]
notebooklm = ["notebooklm-py[android,browser]>=0.8.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
brightlearn = "cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "cli", "dashboard"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# Committed migrations are frozen SQL: reflowing a line would change the migration.
"core/memory/migrations/v*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
